<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Universo Kosmos — a plataforma de onboarding da Kosmos Inteligência Digital."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Universo Kosmos</title>

    <!--
      Link preview (Open Graph + Twitter). WhatsApp, Instagram and Facebook
      scrape the raw HTML and do not run our JavaScript, so these must be static
      here rather than set by React. The image is an absolute URL — a scraper
      has no page context to resolve a relative one against — and is a real
      real 1200×630 JPEG (public/og-image.jpg), because those scrapers do not
      render SVG previews and skip images that are too large.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universo Kosmos" />
    <meta property="og:title" content="Universo Kosmos" />
    <meta
      property="og:description"
      content="A plataforma de onboarding da Kosmos Inteligência Digital. Suas trilhas, suas aulas e seu progresso em um só lugar."
    />
    <meta property="og:url" content="https://universo.kosmosdigital.com.br/" />
    <meta property="og:image" content="https://universo.kosmosdigital.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Universo Kosmos" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universo Kosmos" />
    <meta
      name="twitter:description"
      content="A plataforma de onboarding da Kosmos Inteligência Digital."
    />
    <meta name="twitter:image" content="https://universo.kosmosdigital.com.br/og-image.jpg" />

    <!--
      Resolve the theme before the first paint.

      React mounts a moment after the document does. Without this, a person
      opening the app at night gets a white flash and then the dark screen they
      asked for — which is worse than either, and lands at exactly the moment
      it hurts most. The storage key is shared with src/theme/theme-context.ts
      and the two must not drift.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kosmos-theme');
          var followSystem = stored !== 'light' && stored !== 'dark';
          var dark = followSystem
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'dark';
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* Site data blocked. Light is a safe floor, and React corrects it. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
